name: Engine rootfs

# Builds the Hermes Local engine payload (Ubuntu 24.04 rootfs + Hermes Agent + antigravity-oauth +
# agy CLI) for arm64 (the phone) and x86_64 (CI emulator only), smoke-tests it in a chroot and in
# proot, and publishes release `engine-<hermes ref>-<revision>` with sha256 files.

on:
  workflow_dispatch:
    inputs:
      hermes_ref:
        description: "Hermes Agent release tag (stable)"
        default: "v0.23.2"
      revision:
        description: "Payload revision (engine-<ref>-<revision>)"
        default: "2"
      archs:
        description: "Architectures (json list)"
        default: '["arm64","x86_64"]'
      publish:
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: engine-rootfs
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.archs) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 150
    env:
      OUT_DIR: ${{ github.workspace }}/out
      WORK_DIR: ${{ github.workspace }}/build
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates xz-utils zstd jq shellcheck libtalloc-dev gawk
          df -h /

      - name: Lint
        run: |
          for f in engine/*.sh engine/rootfs/hermes-local-*; do bash -n "$f"; done
          shellcheck -S error engine/*.sh engine/rootfs/hermes-local-* || true

      - name: Resolve Hermes commit
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.hermes_ref }}
        run: |
          sha=$(git ls-remote https://github.com/NousResearch/hermes-agent "refs/tags/$REF^{}" | cut -f1)
          [ -n "$sha" ] || sha=$(git ls-remote https://github.com/NousResearch/hermes-agent "refs/tags/$REF" | cut -f1)
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::tag $REF not found"; exit 1; }
          echo "sha=$sha" >>"$GITHUB_OUTPUT"; echo "Hermes $REF = $sha"

      - name: Build rootfs
        env:
          HERMES_REF: ${{ inputs.hermes_ref }}
          HERMES_COMMIT: ${{ steps.ref.outputs.sha }}
          ENGINE_REVISION: ${{ inputs.revision }}
          GIT_SHA: ${{ github.sha }}
          # Installed size limit (the build fails above it): 3.2 GB for the phone's arm64 engine; the x86_64
          # engine (CI emulator only) has bigger binaries.
          SIZE_LIMIT: ${{ matrix.arch == 'arm64' && '3200000000' || '3350000000' }}
        run: |
          sudo --preserve-env=OUT_DIR,WORK_DIR,HERMES_REF,HERMES_COMMIT,ENGINE_REVISION,GIT_SHA,SIZE_LIMIT bash engine/build-rootfs.sh
          sudo chown -R "$(id -u):$(id -g)" "$OUT_DIR"
          ls -l "$OUT_DIR"

      - name: Smoke test (chroot)
        id: smoke_chroot
        continue-on-error: true
        run: sudo CAPTURE_DIR="$OUT_DIR/captures-${{ matrix.arch }}" SMOKE_TIMEOUT=300 bash engine/smoke-test.sh "$WORK_DIR/rootfs" chroot

      # Ubuntu's apt proot (5.1.0) segfaults on Hermes' python 3.14; the phone runs Termux's proot, so the
      # host smoke test uses the same termux/proot source built for the runner.
      - name: Build proot (termux/proot, same code as the phone)
        run: |
          git clone -q --depth 1 https://github.com/termux/proot "$RUNNER_TEMP/proot-src"
          # HAS_LOADER_32BIT= : skip the arm32 loader (needs -m32, which aarch64 gcc lacks).
          make -s -C "$RUNNER_TEMP/proot-src/src" -j"$(nproc)" HAS_LOADER_32BIT= proot
          git -C "$RUNNER_TEMP/proot-src" rev-parse HEAD

      - name: Smoke test (proot)
        id: smoke_proot
        continue-on-error: true
        run: sudo CAPTURE_DIR="$OUT_DIR/captures-${{ matrix.arch }}" PROOT="$RUNNER_TEMP/proot-src/src/proot" SMOKE_TIMEOUT=420 bash engine/smoke-test.sh "$WORK_DIR/rootfs" proot

      - name: Record smoke results
        run: |
          echo "chroot=${{ steps.smoke_chroot.outcome }} proot=${{ steps.smoke_proot.outcome }}" | tee out/smoke-${{ matrix.arch }}.txt
          sudo chown -R "$(id -u):$(id -g)" out
          # Captures travel as one tarball (the release step flattens files).
          if [ -d "out/captures-${{ matrix.arch }}" ]; then tar -C out -czf "out/captures-${{ matrix.arch }}.tgz" "captures-${{ matrix.arch }}" && rm -rf "out/captures-${{ matrix.arch }}"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.arch }}
          path: out/*
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ inputs.publish && !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Curated release notes (engine/release-notes/<tag>.md) when the repository has them.
      - uses: actions/checkout@v4
        with: { path: src, sparse-checkout: engine/release-notes }
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Publish release
        env:
          TAG: engine-${{ inputs.hermes_ref }}-${{ inputs.revision }}
        run: |
          set -euo pipefail
          mkdir out; find dl -type f -exec mv {} out/ \;
          ls -l out
          ls out/rootfs-*.tar.zst >/dev/null || { echo "::error::no payload built"; exit 1; }
          # Publish only when every requested arch built and passed both smoke tests.
          for a in $(jq -r '.[]' <<<'${{ inputs.archs }}'); do
            f=$([ "$a" = arm64 ] && echo arm64 || echo x86_64)
            [ -f "out/rootfs-$f.tar.zst" ] || { echo "::error::$f payload missing; not publishing"; exit 1; }
            grep -qx "chroot=success proot=success" "out/smoke-$f.txt" || { echo "::error::$f smoke failed ($(cat out/smoke-$f.txt 2>/dev/null)); not publishing"; exit 1; }
          done
          curated="src/engine/release-notes/$TAG.md"
          {
            if [ -f "$curated" ]; then cat "$curated"; echo; echo "## Assets"; echo; fi
            echo "Hermes Local engine payload (tar + zstd -19 --long=27; slim: one dependency generation, no .git/node_modules/tests/TUI/desktop/gcc): Hermes Agent ${{ inputs.hermes_ref }}, Ubuntu 24.04, local Chromium, antigravity-oauth plugin, agy CLI, voice (edge-tts, cloud speech-to-text from the user's OpenAI/Gemini key, live voice bridge: GPT-Live via ChatGPT/Codex sign-in or Gemini Live; no local Whisper)."
            echo
            for f in out/rootfs-*.tar.zst; do a=$(basename "$f" .tar.zst); a=${a#rootfs-}; echo "- \`$(basename "$f")\`: $(( $(stat -c %s "$f") / 1048576 )) MiB, sha256 \`$(cut -d' ' -f1 "$f.sha256")\`, installed $(( $(jq .installed_disk_bytes "out/engine-$a.json") / 1048576 )) MiB"; done
            echo
            echo "Smoke tests: $(cat out/smoke-*.txt 2>/dev/null | tr '\n' ' ')"
            echo "x86_64 is for the CI emulator only. Built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "Engine ${TAG#engine-}" --notes-file notes.md --latest=false --repo "$GITHUB_REPOSITORY"
          fi
      - name: Public download check (no token, like the app)
        env:
          TAG: engine-${{ inputs.hermes_ref }}-${{ inputs.revision }}
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          for a in $(jq -r '.[]' <<<'${{ inputs.archs }}'); do
            want=$(env -u GH_TOKEN curl -fsSL --retry 5 "$base/rootfs-$a.tar.zst.sha256" | cut -d' ' -f1)
            got=$(env -u GH_TOKEN curl -fsSL --retry 5 "$base/rootfs-$a.tar.zst" | sha256sum | cut -d' ' -f1)
            echo "rootfs-$a.tar.zst: published sha256 $want, downloaded $got"
            [ "$want" = "$got" ] || { echo "::error::public download of rootfs-$a.tar.zst does not match its sha256"; exit 1; }
          done
          echo "PUBLIC_DOWNLOAD_OK $TAG"
