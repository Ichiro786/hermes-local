name: Engine feature probe

# Runs a published engine payload under termux/proot (the phone's proot) on a native arm64 runner and
# probes the Hermes features the mobile app uses (engine/feature-probe.sh via smoke-test.sh FEATURES=1).

on:
  workflow_dispatch:
    inputs:
      engine_tag:
        default: "engine-v0.23.2-4"
      arch:
        default: "arm64"
      artifact_run:
        description: "Use the engine-<arch> artifact of this engine.yml run instead of the release (optional)"
        default: ""
      voice_bench:
        description: "Benchmark Whisper tiny/base/small on the runner CPU (1/0)"
        default: "1"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends curl ca-certificates xz-utils zstd jq libtalloc-dev gawk
      - name: Engine payload
        env:
          ARTIFACT_RUN: ${{ inputs.artifact_run }}
          ENGINE_TAG: ${{ inputs.engine_tag }}
          ARCH: ${{ inputs.arch }}
        run: |
          if [ -n "$ARTIFACT_RUN" ]; then
            gh run download "$ARTIFACT_RUN" --repo "$GITHUB_REPOSITORY" -n "engine-$ARCH" -D dl
          else
            if ! gh release download "$ENGINE_TAG" --repo "$GITHUB_REPOSITORY" -D dl -p "rootfs-$ARCH.tar.zst*"; then
              gh release download "$ENGINE_TAG" --repo "$GITHUB_REPOSITORY" -D dl -p "rootfs-$ARCH.tar.xz*"
            fi
          fi
          ls -l dl
          asset="rootfs-$ARCH.tar.zst"
          [ -f "dl/$asset" ] || asset="rootfs-$ARCH.tar.xz"
          (cd dl && sha256sum -c "$asset.sha256")
          sudo mkdir -p "$RUNNER_TEMP/rootfs"
          sudo tar -C "$RUNNER_TEMP/rootfs" --numeric-owner -xf "dl/$asset"
      - name: Build proot (termux/proot)
        run: |
          git clone -q --depth 1 https://github.com/termux/proot "$RUNNER_TEMP/proot-src"
          make -s -C "$RUNNER_TEMP/proot-src/src" -j"$(nproc)" HAS_LOADER_32BIT= proot
      - name: Feature probe (proot)
        run: |
          mkdir -p out
          sudo FEATURES=1 VOICE_BENCH="${{ inputs.voice_bench }}" CAPTURE_DIR="$PWD/out/captures" SMOKE_NET_CHECKS=0 PROOT="$RUNNER_TEMP/proot-src/src/proot" SMOKE_TIMEOUT=420 \
            bash engine/smoke-test.sh "$RUNNER_TEMP/rootfs" proot 2>&1 | tee out/probe.log || true
          grep -E "^(FEATURE|CHECK)|^\[[a-z-]+\] VOICE|^BENCH|SMOKE TEST" out/probe.log | tee out/features.txt
      - uses: actions/upload-artifact@v4
        with:
          name: features-${{ inputs.arch }}
          path: out/
