name: Android APK

# Builds the release APK (arm64-v8a, no bundled engine since test5: it downloads the engine release on first
# run, sha256 baked in; signed with the CI keystore from repo secrets) and x86_64 CI variants for an API 36
# emulator e2e (scripts/e2e-emulator.sh): fresh install, providers, Storage clean-up, and an upgrade from the
# v1.0.0-test4 app (built from its tag with its bundled engine) to this build.
#
# Secrets: ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
#
# Update safety (the APK must install over the user's existing app without losing data): the release job checks
# the package name, that versionCode is above min_version_code, and that the signing certificate equals
# expected_cert_sha256 and the certificate of the APK built by compare_run (the previously distributed build).

on:
  workflow_dispatch:
    inputs:
      engine_tag:
        description: "Engine release the app downloads"
        default: "engine-v0.23.2-4"
      version_name:
        default: "1.1.0"
      emulator:
        type: boolean
        default: true
      upgrade_from:
        description: "App tag for the upgrade test (empty = skip)"
        default: "v1.0.0-test4"
      min_version_code:
        description: "versionCode of the newest distributed build; this build must be higher"
        default: "20"
      compare_run:
        description: "Workflow run whose arm64 APK is the installed build (signature + package check; empty = skip)"
        default: "44606647149"
      expected_cert_sha256:
        description: "SHA-256 of the release signing certificate (published with v1.0.0-test1/test2)"
        default: "6b4eea786e5d6f126828ab2d650295d85a89bfab4189b02d7bf83fe12d306ecd"
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v1.1.0; main only, needs android/release-notes/<tag>.md). Empty = no release"
        default: ""

permissions:
  contents: read
  actions: read # compare_run: download the previously distributed APK of this repository

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version_code: ${{ steps.compat.outputs.version_code }}
      cert: ${{ steps.compat.outputs.cert }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
        with: { packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.8.2" }
      - run: sudo apt-get install -y --no-install-recommends patchelf
      - name: Engine sha256 (the app downloads the payload itself)
        run: |
          mkdir -p engine-dl
          gh release download "${{ inputs.engine_tag }}" --repo "$GITHUB_REPOSITORY" -D engine-dl -p 'rootfs-arm64.tar.zst.sha256'
          cat engine-dl/*.sha256
      - name: Keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          [ -n "$KS" ] || { echo "::error::ANDROID_KEYSTORE_B64 secret missing"; exit 1; }
          echo "$KS" | base64 -d >"$RUNNER_TEMP/release.jks"
      - name: Build release APK
        env:
          ENGINE_DIR: engine-dl
          ENGINE_TAG: ${{ inputs.engine_tag }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ github.run_number }}
          GRADLE: gradle
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/build-apk.sh
      - name: Verify signature + badging
        run: |
          $ANDROID_HOME/build-tools/37.0.0/apksigner verify --print-certs out/*.apk | head -5
          $ANDROID_HOME/build-tools/37.0.0/aapt2 dump badging out/*.apk | grep -E "^package|sdkVersion|targetSdk" || true
          ls -l out/*.apk; sha256sum out/*.apk
      - name: Update compatibility (package, versionCode, signing certificate)
        id: compat
        env:
          EXPECTED_CERT: ${{ inputs.expected_cert_sha256 }}
          MIN_VC: ${{ inputs.min_version_code }}
          COMPARE_RUN: ${{ inputs.compare_run }}
        run: |
          set -euo pipefail
          bt=$ANDROID_HOME/build-tools/37.0.0
          info() { # info <apk>: "<package> <versionCode> <cert sha256>"
            local b c # whole outputs first: a pipe into head/grep -m1 can SIGPIPE the producer under pipefail
            b=$("$bt/aapt2" dump badging "$1"); b=${b%%$'\n'*}
            c=$("$bt/apksigner" verify --print-certs "$1"); c=$(grep -oE 'certificate SHA-256 digest: [0-9a-f]{64}' <<<"$c" | head -n1 | awk '{print $NF}')
            echo "$(sed -E "s/^package: name='([^']+)'.*/\1/" <<<"$b") $(sed -E "s/.* versionCode='([0-9]+)'.*/\1/" <<<"$b") $c"
          }
          read -r pkg vc cert <<<"$(info out/hermes-local-*-arm64-v8a.apk)"
          echo "new build: package=$pkg versionCode=$vc cert=$cert"
          fail=0
          [ "$pkg" = dev.syed.hermeslocal ] || { echo "::error::package $pkg is not dev.syed.hermeslocal"; fail=1; }
          [ "$vc" -gt "$MIN_VC" ] || { echo "::error::versionCode $vc is not above $MIN_VC (Android refuses a downgrade)"; fail=1; }
          [ "$cert" = "$EXPECTED_CERT" ] || { echo "::error::signing certificate $cert is not $EXPECTED_CERT"; fail=1; }
          if [ -n "$COMPARE_RUN" ]; then
            mkdir -p prev
            gh run download "$COMPARE_RUN" --repo "$GITHUB_REPOSITORY" -n hermes-local-1.0.0-arm64-v8a -D prev
            read -r ppkg pvc pcert <<<"$(info prev/*.apk)"
            echo "previous build (run $COMPARE_RUN): package=$ppkg versionCode=$pvc cert=$pcert sha256=$(sha256sum prev/*.apk | cut -d' ' -f1)"
            [ "$ppkg" = "$pkg" ] || { echo "::error::package differs from run $COMPARE_RUN ($ppkg)"; fail=1; }
            [ "$pcert" = "$cert" ] || { echo "::error::signing certificate differs from run $COMPARE_RUN ($pcert)"; fail=1; }
            [ "$vc" -gt "$pvc" ] || { echo "::error::versionCode $vc is not above run $COMPARE_RUN's $pvc"; fail=1; }
          fi
          [ "$fail" = 0 ] && echo "UPDATE_COMPATIBLE package=$pkg versionCode=$vc (> $MIN_VC) cert=$cert"
          { echo "version_code=$vc"; echo "cert=$cert"; } >>"$GITHUB_OUTPUT"
          exit "$fail"
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-local-${{ inputs.version_name }}-arm64-v8a
          path: out/*.apk
          compression-level: 0

  unit:
    # JVM unit tests (Robolectric): auto-wake detection and debounce, engine start/stop decisions, storage, sign-in
    # parsing, screen previews (screenshots uploaded as evidence).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
        with: { packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.8.2" }
      - run: sudo apt-get install -y --no-install-recommends patchelf
      - name: Native libraries (proot) for the unit-test build
        run: bash scripts/fetch-proot.sh
      - name: Unit tests
        working-directory: android
        env:
          SHOTS_DIR: ${{ github.workspace }}/shots
        run: gradle --no-daemon -PversionCode=${{ github.run_number }} :app:testDebugUnitTest
      - name: Unit test summary
        if: always()
        run: |
          python3 - <<'PY2'
          import glob, xml.etree.ElementTree as ET
          tot = [0, 0, 0, 0]
          for f in sorted(glob.glob("android/app/build/test-results/testDebugUnitTest/*.xml")):
              s = ET.parse(f).getroot()
              n, fl, er, sk = (int(s.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
              tot = [a + b for a, b in zip(tot, (n, fl, er, sk))]
              print(f"UNIT {s.get('name')}: {n} tests, {fl} failed, {er} errors, {sk} skipped")
              for c in s.iter("testcase"):
                  bad = c.find("failure") if c.find("failure") is not None else c.find("error")
                  if bad is not None: print(f"  FAIL {c.get('name')}: {(bad.get('message') or '')[:300]}")
          print(f"UNIT TOTAL: {tot[0]} tests, {tot[1]} failed, {tot[2]} errors, {tot[3]} skipped")
          PY2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
            shots/

  emulator:
    if: ${{ inputs.emulator }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
        with: { packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.8.2" }
      - run: sudo apt-get install -y --no-install-recommends patchelf
      - name: Old app for the upgrade test (its own tag, its own bundled engine)
        if: ${{ inputs.upgrade_from != '' }}
        run: |
          git worktree add old "${{ inputs.upgrade_from }}"
          eng=$(grep -oE 'engine-v[0-9.]+-[0-9]+' old/scripts/build-apk.sh | head -n1); echo "old engine: $eng"
          mkdir -p engine-old
          gh release download "$eng" --repo "$GITHUB_REPOSITORY" -D engine-old -p 'rootfs-x86_64.tar.xz*'
          cd old && ENGINE_DIR=../engine-old ENGINE_TAG="$eng" ABI=x86_64 GRADLE=gradle GRADLE_ARGS=-PciHooks=true VERSION_CODE=1 bash scripts/build-apk.sh
          ls -l out/; rm -rf ../engine-old android/app/build
      - name: Build x86_64 CI APK (debug key, CI hooks)
        env:
          ENGINE_TAG: ${{ inputs.engine_tag }}
          ABI: x86_64
          GRADLE: gradle
          GRADLE_ARGS: -PciHooks=true
          VERSION_CODE: ${{ github.run_number }}
        run: bash scripts/build-apk.sh
      - name: Emulator e2e
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          ram-size: 6144M
          disk-size: 16G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ENGINE_TAG=${{ inputs.engine_tag }} bash scripts/e2e-emulator.sh out/hermes-local-1.0.0-x86_64.apk e2e ${{ inputs.upgrade_from != '' && 'old/out/hermes-local-1.0.0-x86_64.apk' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-evidence
          path: e2e/

  release:
    # Publishes the signed arm64 APK as a GitHub Release, only from main and only when the build, the update
    # compatibility check, the unit tests and (when it ran) the emulator e2e all passed.
    needs: [apk, unit, emulator]
    if: ${{ always() && inputs.release_tag != '' && needs.apk.result == 'success' && needs.unit.result == 'success' && (needs.emulator.result == 'success' || (needs.emulator.result == 'skipped' && !inputs.emulator)) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag }}
      VERSION: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: android/release-notes }
      - uses: actions/download-artifact@v4
        with: { name: "hermes-local-${{ inputs.version_name }}-arm64-v8a", path: out }
      - name: Publish release
        env:
          ENGINE_TAG: ${{ inputs.engine_tag }}
          VERSION_CODE: ${{ needs.apk.outputs.version_code }}
          CERT: ${{ needs.apk.outputs.cert }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::releases are published from main only ($GITHUB_REF)"; exit 1; }
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::release tag $TAG is not vX.Y.Z"; exit 1; }
          [ "$TAG" = "v$VERSION" ] || { echo "::error::tag $TAG does not match version_name $VERSION"; exit 1; }
          notes="android/release-notes/$TAG.md"
          [ -f "$notes" ] || { echo "::error::$notes missing"; exit 1; }
          ! grep -q PLACEHOLDER "$notes" || { echo "::error::$notes still has a placeholder"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "::error::release $TAG exists already"; exit 1; fi
          ls out/*.apk >/dev/null
          [ "$(ls out/*.apk | wc -l)" = 1 ] || { echo "::error::expected one APK"; ls -l out; exit 1; }
          apk=$(basename out/*.apk)
          (cd out && sha256sum "$apk" >"$apk.sha256")
          {
            cat "$notes"
            echo
            echo "## Download"
            echo
            echo "- \`$apk\` (arm64-v8a, signed): sha256 \`$(cut -d' ' -f1 "out/$apk.sha256")\`"
            echo "- Version $VERSION (versionCode $VERSION_CODE), package \`dev.syed.hermeslocal\`"
            echo "- Signing certificate SHA-256 \`$CERT\` (the same key as every earlier Hermes Local build)"
            echo "- Engine: [\`$ENGINE_TAG\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$ENGINE_TAG), downloaded by the app on first launch"
            echo
            echo "Built and verified by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >notes.md
          gh release create "$TAG" "out/$apk" "out/$apk.sha256" --target "$GITHUB_SHA" --title "Hermes Local $VERSION" \
            --notes-file notes.md --latest --repo "$GITHUB_REPOSITORY"
      - name: Public download check (no token)
        run: |
          set -euo pipefail
          apk=$(basename out/*.apk)
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$apk"
          got=$(env -u GH_TOKEN curl -fsSL --retry 5 "$url" | sha256sum | cut -d' ' -f1)
          want=$(cut -d' ' -f1 "out/$apk.sha256")
          echo "$url: sha256 $got (built $want)"
          [ "$got" = "$want" ] || { echo "::error::public APK download does not match the built APK"; exit 1; }
          echo "PUBLIC_DOWNLOAD_OK $url"
